<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="香港私家醫院疼痛管理定額比價">
    <title>醫療價格第三方門戶 - 疼痛管理決策中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>        :root { --ufh-blue: #1D4E89; --title-blue: #2B579A; --ufh-mint: #99D6D1; }
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background-color: #F7F8FA; color: #333; scroll-behavior: smooth; }
        .sidebar-fixed { width: 280px; height: calc(100vh - 64px); position: fixed; top: 64px; left: 0; background: white; border-right: 1px solid #E5E7EB; overflow-y: auto; z-index: 40; }
        .main-content { padding-top: 80px; padding-bottom: 60px; }
        @media (min-width: 1024px) { .main-content { margin-left: 280px; } }
        .comparison-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 3rem; border: 1px solid #F3F4F6; overflow: hidden; }
        .hospital-box { border-radius: 8px; padding: 16px; border: 1px solid #F3F4F6; transition: all 0.2s; position: relative; background: white; }
        .hospital-box.best-value { border: 2px solid var(--ufh-mint); background-color: #F0FAF9; }
        .hospital-box.coming-soon-card { border-color: #E5E7EB; background-color: #F9FAFB; }
        .user-hidden { display: none !important; }
        .price-hidden { display: none !important; }
        .hospital-link { color: var(--title-blue); font-weight: bold; text-decoration: none; border-bottom: 1px solid transparent; transition: 0.2s; display: inline-block; }
        .hospital-link:hover { border-bottom-color: var(--ufh-mint); color: var(--ufh-blue); }
        .section-header::before { content: ""; display: inline-block; width: 4px; height: 20px; background: var(--ufh-mint); margin-right: 10px; vertical-align: middle; }
        .lane-container { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 2.5rem; border: 1px solid #E5E7EB; padding: 20px; }
        .lane-header::before { content: ""; display: inline-block; width: 4px; height: 16px; background: var(--ufh-blue); margin-right: 8px; vertical-align: middle; }</style>
</head>
<body data-page-module="painManagement">
    <header class="h-16 bg-[#1D4E89] text-white fixed w-full z-[100] flex items-center px-6 shadow-md" role="banner">
        <div class="flex items-center gap-3">
            <button type="button" data-action="go-back-home" data-hash="#specialties" class="w-7 h-7 bg-[#99D6D1] rounded-sm flex items-center justify-center text-[#1D4E89] font-bold hover:bg-white transition-colors" aria-label="返回首頁">←</button>
            <span class="text-xl font-bold tracking-tighter">MedicalPrice <span class="font-light opacity-60 ml-2">疼痛管理決策中心</span></span>
        </div>
    </header>
    <div class="flex">
        <aside class="sidebar-fixed p-6 hidden lg:block" aria-label="醫院篩選">
            <div class="mb-6"><p class="text-xs font-bold text-gray-400 mb-2">📍 當前模組</p>
            <div class="text-xs font-bold text-[#1D4E89] p-2.5 bg-blue-50 rounded">⚡ 疼痛科定額比價</div></div>
            <div id="filter-container" class="space-y-3 px-1 h-[450px] overflow-y-auto"></div>
        </aside>
        <main class="main-content flex-1 px-4 lg:px-10" role="main">
            <div class="max-w-6xl mx-auto">
                <section class="mb-8">
                    <h1 class="text-2xl font-black text-[#2B579A] mb-4">全港私家醫院疼痛管理定額對比</h1>
                    <div class="mt-6 bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-wrap gap-6">
                        <div class="flex-1 min-w-[240px]">
                            <label for="insurance-select" class="block text-xs font-bold text-gray-500 mb-2">🛡️ 醫療保障</label>
                            <select id="insurance-select" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50">
                                <option value="none">無醫療保險 (全額自付)</option>
                                <option value="vhis-std">VHIS 自願醫保 (標準計劃)</option>
                                <option value="vhis-adv">VHIS 自願醫保 (靈活/高端計劃)</option>
                            </select>
                        </div>
                    </div>
                </section>
                <h2 class="section-header text-xl font-bold text-[#2B579A] mb-2">微創神經阻滯治療 (Nerve Block)</h2>
                <p class="text-xs text-gray-500 mb-4 bg-blue-50/50 inline-block px-3 py-1 rounded">ℹ️ 有定額數據的醫院自動 Top 3 排序；暫無數據沉底顯示 Coming Soon。</p>
                <div class="comparison-card"><div class="p-6">
                    <div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-6" data-module="painManagement" data-procedure="nerve_block"></div>
                </div></div>
                                <footer class="mt-16 bg-gray-800 text-white rounded-xl overflow-hidden shadow-lg mb-8" role="contentinfo">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-px bg-gray-700">
                        <div class="bg-gray-800 p-8 flex flex-col">
                            <h4 class="text-lg font-bold mb-3">🏥 醫療機構專屬通道</h4>
                            <p class="text-sm text-gray-300 leading-relaxed mb-6 flex-grow">若貴院發現數據有誤，歡迎聯絡我們於 24 小時內優先處理更新請求。</p>
                            <a href="mailto:data@medicalprice.hk?subject=官方數據糾錯" class="inline-block bg-gray-700 hover:bg-gray-600 text-white text-sm font-bold py-2.5 px-5 rounded border border-gray-600 text-center md:w-auto">官方數據糾錯 →</a>
                        </div>
                        <div class="bg-gray-800 p-8 flex flex-col">
                            <h4 class="text-lg font-bold mb-3">💬 找不到想看的程序？</h4>
                            <p class="text-sm text-gray-300 leading-relaxed mb-6 flex-grow">數據庫持續擴充中，歡迎提交數據需求。</p>
                            <a href="mailto:contact@medicalprice.hk?subject=數據需求" class="inline-block bg-[#2B579A] hover:bg-[#1D4E89] text-white text-sm font-bold py-2.5 px-5 rounded text-center md:w-auto">聯繫我們 →</a>
                        </div>
                    </div>
                    <div class="bg-gray-900 p-6 text-xs text-gray-400">
                        <p class="leading-relaxed">⚖️ 免責聲明：所有數據僅供預算參考，<strong>不構成醫療診斷或理賠承諾</strong>。請於治療前向醫療機構確認最終報價。</p>
                    </div>
                </footer>
            </div>
        </main>
    </div>
    <script src="data/db.js"></script>
    <script src="js/engine.js"></script>
</body>
</html>
