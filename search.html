    <main class="pt-24 pb-16 px-4 max-w-3xl mx-auto" role="main">
        <h1 class="text-2xl font-black text-[#2B579A] mb-2">搜尋結果</h1>
        <p id="search-query-display" class="text-sm text-gray-500 mb-6"></p>
        <div id="search-results" class="space-y-3"></div>
        <p id="search-empty" class="hidden text-center text-gray-400 py-12">找不到相關項目。可試症狀或俗稱（例如：膽石、通波仔、大便帶血、疝氣），或正式名稱（大腸鏡、病房）。</p>
        <footer class="mt-16 mb-8 text-xs text-gray-500" role="contentinfo">
            <p class="leading-relaxed">免責聲明：所有資料僅供預算參考，不構成醫療診斷或理賠承諾。</p>
            <p class="mt-3"><a href="sources.html" class="text-[#2B579A] hover:underline font-medium">資料來源與更新 →</a></p>
        </footer>

    <script src="data/search-index.js" defer></script>
    <script src="js/site-polish.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            function escapeHtml(str) {
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            var params = new URLSearchParams(window.location.search);
            var q = params.get('q') || '';
            document.getElementById('search-query-display').textContent = q ? '關鍵字：「' + q + '」' : '';

            var results = typeof searchMedicalIndex === 'function' ? searchMedicalIndex(q) : [];
            var container = document.getElementById('search-results');
            var empty = document.getElementById('search-empty');

            if (!q || !results.length) {
                empty.classList.remove('hidden');
                return;
            }

            var ins = params.get('insurance') || 'none';
            var time = params.get('time') || 'regular';
            var baseParams = '?insurance=' + encodeURIComponent(ins) + '&time=' + encodeURIComponent(time);

            container.innerHTML = results.map(function (item) {
                var page = String(item.page || '');
                var hash = String(item.hash || '');
                if (hash && !/^#[A-Za-z][\w-]*$/.test(hash)) hash = '';
                var href = page + baseParams + hash;
                var label = escapeHtml(item.label || page);
                var pathLabel = escapeHtml(page + hash);
                return '<a href="' + escapeHtml(href) + '" class="block bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:border-[#99D6D1] transition-all">' +
                    '<div class="font-bold text-[#2B579A]">' + label + '</div>' +
                    '<div class="text-xs text-gray-400 mt-1">' + pathLabel + '</div></a>';
            }).join('');
        });
    </script>
