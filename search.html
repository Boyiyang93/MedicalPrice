<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MedicalPrice 全站醫療價格搜尋">
    <title>搜尋結果 - MedicalPrice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body>
    <header class="h-16 bg-[#1D4E89] text-white fixed w-full z-50 flex items-center px-6 shadow-md" role="banner">
        <a href="index.html" class="flex items-center gap-3" aria-label="返回首頁">
            <span class="w-7 h-7 bg-[#99D6D1] rounded-sm flex items-center justify-center text-[#1D4E89] font-bold">←</span>
            <span class="text-xl font-bold">MedicalPrice <span class="font-light opacity-60 ml-2">搜尋結果</span></span>
        </a>
    </header>

    <main class="pt-24 pb-16 px-4 max-w-3xl mx-auto" role="main">
        <h1 class="text-2xl font-black text-[#2B579A] mb-2">搜尋結果</h1>
        <p id="search-query-display" class="text-sm text-gray-500 mb-6"></p>
        <div id="search-results" class="space-y-3"></div>
        <p id="search-empty" class="hidden text-center text-gray-400 py-12">找不到相關項目，請嘗試其他關鍵字（如：結腸鏡、病房、膽囊）。</p>
    </main>

    <script src="data/db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var params = new URLSearchParams(window.location.search);
            var q = params.get('q') || '';
            document.getElementById('search-query-display').textContent = q ? '關鍵字：「' + q + '」' : '';

            var results = typeof searchMedicalIndex === 'function' ? searchMedicalIndex(q) : [];
            var container = document.getElementById('search-results');
            var empty = document.getElementById('search-empty');

            if (!q || !results.length) {
                empty.classList.remove('hidden');
                return;
            }

            var ins = params.get('insurance') || 'none';
            var time = params.get('time') || 'regular';
            var baseParams = '?insurance=' + encodeURIComponent(ins) + '&time=' + encodeURIComponent(time);

            container.innerHTML = results.map(function (item) {
                var href = item.page + baseParams + (item.hash || '');
                return '<a href="' + href + '" class="block bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:border-[#99D6D1] transition-all">' +
                    '<div class="font-bold text-[#2B579A]">' + item.label + '</div>' +
                    '<div class="text-xs text-gray-400 mt-1">' + item.page + (item.hash || '') + '</div></a>';
            }).join('');
        });
    </script>
</body>
</html>
