<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫療價格第三方門戶 - 一般外科決策中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body data-page-module="generalSurgery">

    <header class="h-16 bg-[#1D4E89] text-white fixed w-full z-[100] flex items-center px-6 justify-between shadow-md">
        <div class="flex items-center gap-3">
            <button type="button" id="btn-back-home" data-action="go-back-home" data-hash="#specialties" class="w-7 h-7 bg-[#99D6D1] rounded-sm flex items-center justify-center text-[#1D4E89] font-bold hover:bg-white transition-colors">←</button>
            <span class="text-xl font-bold tracking-tighter">MedicalPrice <span class="font-light opacity-60 ml-2">一般外科決策中心</span></span>
        </div>
        <nav class="hidden md:flex gap-6 text-sm">
            <a href="index.html" class="hover:text-[#99D6D1]">首頁</a>
            <a href="index.html#specialties" class="text-[#99D6D1] font-bold">專科比價</a>
            <a href="intelligence.html" class="hover:text-[#99D6D1]">醫療情報</a>
        </nav>
    </header>

    <div class="flex">
        <aside class="sidebar-fixed p-6 hidden lg:block">
            <div class="mb-6">
                <p class="text-xs font-bold text-gray-400 mb-2">📍 當前模組</p>
                <div class="text-xs font-bold text-[#1D4E89] p-2.5 bg-blue-50 rounded flex items-center gap-2">✂️ 日間外科手術定額比價</div>
            </div>
            <div>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">醫院篩選器 (動態多選)</p>
                <div class="space-y-3 px-1 h-[450px] overflow-y-auto" id="filter-container"></div>
            </div>
        </aside>

        <main class="main-content flex-1 px-4 lg:px-10">
            <div class="max-w-6xl mx-auto">
                <section class="mb-8">
                    <h2 class="text-2xl font-black text-[#2B579A] mb-4">全港私家醫院日間一般外科手術定額對比</h2>
                    <div class="mt-6 bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-wrap gap-6 items-center hidden surgery-filter-panel" data-surgery-filter-panel>
                        <div class="flex-1 min-w-[240px]">
                            <label class="block text-xs font-bold text-gray-500 mb-2">🛡️ 您的醫療保障 (同步自首頁)</label>
                            <select id="insurance-select" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 outline-none">
                                <option value="none">無醫療保險 (全額自付)</option>
                                <option value="vhis-std">VHIS 自願醫保 (標準計劃)</option>
                                <option value="vhis-adv">VHIS 自願醫保 (靈活/高端計劃)</option>
                            </select>
                        </div>
                        <div class="flex-1 min-w-[240px]">
                            <label class="block text-xs font-bold text-gray-500 mb-2">⏱️ 預計手術時間段</label>
                            <select id="time-select" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 outline-none">
                                <option value="regular">常規辦公時間</option>
                                <option value="holiday">非辦公時間 / 公眾假期</option>
                            </select>
                        </div>
                    </div>
                </section>

                                <p class="text-xs text-gray-500 mb-6 bg-blue-50/50 inline-block px-3 py-1 rounded hidden surgery-filter-hint">ℹ️ 有定額數據的醫院自動 Top 3 排序；暫無數據沉底顯示 Coming Soon。</p>
                <section id="cholecystectomy" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">腹腔鏡膽囊切除術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="cholecystectomy"></div></div>
                </section>
                <section id="breast_lump" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">乳房腫塊切除術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="breast_lump"></div></div>
                </section>
                <section id="circumcision" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">包皮環切術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="circumcision"></div></div>
                </section>
                <section id="thyroid_fna" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">甲狀腺細針穿刺檢查</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="thyroid_fna"></div></div>
                </section>
                <section id="hemithyroidectomy" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">偏側甲狀腺切除術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="hemithyroidectomy"></div></div>
                </section>
                <section id="thyroidectomy" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">甲狀腺/副甲狀腺切除術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="thyroidectomy"></div></div>
                </section>
                <section id="hernia_abdominal" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">腹腔疝氣修補術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="hernia_abdominal"></div></div>
                </section>
                <section id="hernia_unilateral" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">單側腹股溝疝氣修補術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="hernia_unilateral"></div></div>
                </section>
                <section id="hernia_bilateral" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">雙側腹股溝疝氣修補術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="hernia_bilateral"></div></div>
                </section>
                <section id="appendectomy" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">闌尾切除術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="appendectomy"></div></div>
                </section>
                <section id="hemorrhoid" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">痔瘡專項處置</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="hemorrhoid"></div></div>
                </section>
                <section id="thyroid_surgery" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">甲狀腺處置手術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="thyroid_surgery"></div></div>
                </section>
                <section id="port_a_cath" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">輸液港手術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="port_a_cath"></div></div>
                </section>
                <section id="breast_biopsy" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">乳腺抽針及旋切活檢</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="breast_biopsy"></div></div>
                </section>
                <section id="breast_surgery" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">乳腺外科手術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="generalSurgery" data-procedure="breast_surgery"></div></div>
                </section>
            </div>
        </main>
    </div>
    <script src="data/db.js"></script>
    <script src="js/engine.js"></script>
</body>
</html>
