<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>門診收費比較 | MedicalPrice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body>

    <header class="h-16 bg-[#1D4E89] text-white fixed w-full z-[100] flex items-center px-6 justify-between shadow-md">
        <div class="flex items-center gap-3">
            <button type="button" id="btn-back-home" data-action="go-back-home" data-hash="#specialties" class="w-7 h-7 bg-[#99D6D1] rounded-sm flex items-center justify-center text-[#1D4E89] font-bold hover:bg-white transition-colors">←</button>
            <span class="text-xl font-bold tracking-tighter">MedicalPrice <span class="font-light opacity-60 ml-2">門診收費比較</span></span>
        </div>
    </header>

    <div class="flex">
        <aside class="sidebar-fixed p-6 hidden lg:block">
            <div class="mb-6">
                <p class="text-xs font-bold text-gray-400 mb-2">📍 當前專科</p>
                <div class="text-xs font-bold text-[#1D4E89] p-2.5 bg-blue-50 rounded flex items-center gap-2">🏥 全港門診/急症收費</div>
            </div>
            <div>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">醫院篩選</p>
                <div class="space-y-3 px-1 h-[450px] overflow-y-auto" id="filter-container">
                    <!-- 篩選框將由 JS 根據 JSON 自動生成，確保增刪醫院時無需修改此處 -->
                </div>
            </div>
        </aside>

        <main class="main-content flex-1 px-4 lg:px-10">
            <div class="max-w-6xl mx-auto">
                <section class="mb-8">
                    <h2 class="text-2xl font-black text-[#2B579A] mb-4">全港私家醫院門診診金比較</h2>
                    <div class="mt-6 bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-wrap gap-6 items-center">
                        <div class="hidden flex-1 min-w-[240px]">
                            <label class="block text-xs font-bold text-gray-500 mb-2">🛡️ 您的門診醫療保障（同步自首頁）</label>
                            <select id="insurance-select" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 outline-none">
                                <option value="none">沒有醫療保險（全額自付）</option>
                                <option value="wemed">WeMedi 門診保／網絡卡（自付額 $50）</option>
                            </select>
                        </div>
                        <div class="flex-1 min-w-[240px]">
                            <label class="block text-xs font-bold text-gray-500 mb-2">⏱️ 請選擇就診時段</label>
                            <select id="time-select" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 outline-none">
                                <option value="regular">平日日間（08:00–18:00）</option>
                                <option value="night">夜診／深夜急症</option>
                                <option value="holiday">公眾假期及惡劣天氣（八號風球／黑雨）</option>
                            </select>
                        </div>
                    </div>
                </section>

                <div class="section-header text-xl font-bold text-[#2B579A] mb-2">普通科全科門診 (General Outpatient)</div>
                <p class="text-xs text-gray-500 mb-4 bg-blue-50/50 inline-block px-3 py-1 rounded">ℹ️ 已按您選擇的時段重新排序，優先顯示最相宜的選項。</p>

                <div class="comparison-card">
                    <div class="p-6">
                        <!-- 骨架屏加載提示 -->
                        <div id="loading-skeleton" class="text-center py-12 text-sm text-gray-400 font-bold animate-pulse">⏳ 正在載入最新收費資料...</div>
                        <div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-6 hidden" id="outpatient-grid">
                            <!-- 核心卡片由 JS 動態異步注入 -->
                        </div>
                    </div>
                </div>

                <div id="specialty-outpatient" class="mt-12">
                    <div class="section-header text-xl font-bold text-[#2B579A] mb-2">專科門診 (Specialist Outpatient)</div>
                    <p class="text-xs text-gray-500 mb-4 bg-blue-50/50 inline-block px-3 py-1 rounded">ℹ️ 專科診金因科室及醫生級別而異；僅展示日間常規時段參考價。</p>

                    <div class="comparison-card">
                        <div class="p-6">
                            <div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-6 hidden" id="outpatient-specialty-grid">
                                <!-- 專科門診卡片由 JS 注入 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="data/db.js"></script>
    <script src="js/engine.js"></script>
    <script>
        let hospitalDatabase = [];
        let specialtyDatabase = [];

        function initPage() {
            hospitalDatabase = getModuleHospitalList('outpatient');
            specialtyDatabase = getModuleHospitalList('outpatientSpecialty');

            renderFilters();
            renderOutpatientGrid('outpatient-grid', hospitalDatabase, { hideInsurance: true });
            renderOutpatientGrid('outpatient-specialty-grid', specialtyDatabase, { type: 'specialty', hideInsurance: true });
            updateView();
        }

        function renderFilters() {
            const container = document.getElementById('filter-container');
            container.innerHTML = hospitalDatabase.map(h => `
                <label class="flex items-center gap-2.5 text-xs ${h.id === 'szufh' ? 'text-[#1D4E89] font-bold' : 'text-gray-600 font-medium'} cursor-pointer">
                    <input type="checkbox" value="${h.id}" checked class="w-4 h-4 rounded text-[#1D4E89]"> ${typeof renderHospitalNameHtml === 'function' ? renderHospitalNameHtml(h) : h.name}
                </label>
            `).join('');
        }

        function renderOutpatientGrid(gridId, hospitals, options = {}) {
            const grid = document.getElementById(gridId);
            if (!grid) return;
            grid.innerHTML = hospitals.map(h => renderOutpatientCardHtml(h, options)).join('');
        }

        window.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
