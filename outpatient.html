<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫療價格第三方門戶 - 門診收費決策中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --ufh-blue: #1D4E89; --title-blue: #2B579A; --ufh-mint: #99D6D1; }
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background-color: #F7F8FA; color: #333; scroll-behavior: smooth; }
        .sidebar-fixed { width: 280px; height: calc(100vh - 64px); position: fixed; top: 64px; left: 0; background: white; border-right: 1px solid #E5E7EB; overflow-y: auto; z-index: 40; }
        .main-content { padding-top: 80px; padding-bottom: 60px; }
        @media (min-width: 1024px) { .main-content { margin-left: 280px; } }
        .comparison-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 3rem; border: 1px solid #F3F4F6; overflow: hidden; }
        .hospital-box { border-radius: 8px; padding: 16px; border: 1px solid #F3F4F6; transition: all 0.2s; position: relative; background: white; }
        .hospital-box.best-value { border: 2px solid var(--ufh-mint); background-color: #F0FAF9; }
        .hospital-box.coming-soon-card { border-color: #E5E7EB; background-color: #F9FAFB; }
        .user-hidden { display: none !important; } 
        .price-hidden { display: none !important; } 
        .hospital-link { color: var(--title-blue); font-weight: bold; text-decoration: none; border-bottom: 1px solid transparent; transition: 0.2s; display: inline-block; }
        .hospital-link:hover { border-bottom-color: var(--ufh-mint); color: var(--ufh-blue); }
        .section-header::before { content: ""; display: inline-block; width: 4px; height: 20px; background: var(--ufh-mint); margin-right: 10px; vertical-align: middle; }
    </style>
</head>
<body>

    <header class="h-16 bg-[#1D4E89] text-white fixed w-full z-[100] flex items-center px-6 justify-between shadow-md">
        <div class="flex items-center gap-3">
            <button type="button" id="btn-back-home" data-action="go-back-home" data-hash="#specialties" class="w-7 h-7 bg-[#99D6D1] rounded-sm flex items-center justify-center text-[#1D4E89] font-bold hover:bg-white transition-colors">←</button>
            <span class="text-xl font-bold tracking-tighter">MedicalPrice <span class="font-light opacity-60 ml-2">門診費用決策中心</span></span>
        </div>
    </header>

    <div class="flex">
        <aside class="sidebar-fixed p-6 hidden lg:block">
            <div class="mb-6">
                <p class="text-xs font-bold text-gray-400 mb-2">📍 當前模組</p>
                <div class="text-xs font-bold text-[#1D4E89] p-2.5 bg-blue-50 rounded flex items-center gap-2">🏥 全港門診/急症收費</div>
            </div>
            <div>
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mb-3">醫院篩選器 (動態多選)</p>
                <div class="space-y-3 px-1 h-[450px] overflow-y-auto" id="filter-container">
                    <!-- 篩選框將由 JS 根據 JSON 自動生成，確保增刪醫院時無需修改此處 -->
                </div>
            </div>
        </aside>

        <main class="main-content flex-1 px-4 lg:px-10">
            <div class="max-w-6xl mx-auto">
                <section class="mb-8">
                    <h2 class="text-2xl font-black text-[#2B579A] mb-4">全港私家醫院全日制門診診金對比</h2>
                    <div class="mt-6 bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-wrap gap-6 items-center">
                        <div class="flex-1 min-w-[240px]">
                            <label class="block text-xs font-bold text-gray-500 mb-2">🛡️ 您的門診醫療保障 (同步自首頁)</label>
                            <select id="insurance-select" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 outline-none">
                                <option value="none">無醫療保險 (全額自付)</option>
                                <option value="wemed">WeMedi 門診保 / 網絡卡 (自付額固定 $50)</option>
                            </select>
                        </div>
                        <div class="flex-1 min-w-[240px]">
                            <label class="block text-xs font-bold text-gray-500 mb-2">⏱️ 請選擇就診時間 / 外部環境狀態</label>
                            <select id="time-select" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50 outline-none">
                                <option value="regular">日間常規辦公時間 (平日 08:00 - 18:00)</option>
                                <option value="night">夜診 / 深夜急診時間</option>
                                <option value="holiday">公眾假期 / 惡劣天氣 (八號風球/黑雨)</option>
                            </select>
                        </div>
                    </div>
                </section>

                <div class="section-header text-xl font-bold text-[#2B579A] mb-2">普通科全科門診 (General Outpatient)</div>
                <p class="text-xs text-gray-500 mb-4 bg-blue-50/50 inline-block px-3 py-1 rounded">ℹ️ 智能動態比價：系統已根據您選擇的時間段，自動為全港醫院重新排序，默認智能展示首選最優 Top 3。</p>

                <div class="comparison-card">
                    <div class="p-6">
                        <!-- 骨架屏加載提示 -->
                        <div id="loading-skeleton" class="text-center py-12 text-sm text-gray-400 font-bold animate-pulse">⏳ 正在實時同步 2026 醫療大數據中心...</div>
                        <div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-6 hidden" id="outpatient-grid">
                            <!-- 核心卡片由 JS 動態異步注入 -->
                        </div>
                    </div>
                </div>

                <div id="specialty-outpatient" class="mt-12">
                    <div class="section-header text-xl font-bold text-[#2B579A] mb-2">專科門診 (Specialist Outpatient)</div>
                    <p class="text-xs text-gray-500 mb-4 bg-blue-50/50 inline-block px-3 py-1 rounded">ℹ️ 專科診金因科室及醫生級別而異；夜診/節日時段請向醫院查詢最新收費。</p>

                    <div class="comparison-card">
                        <div class="p-6">
                            <div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-6 hidden" id="outpatient-specialty-grid">
                                <!-- 專科門診卡片由 JS 注入 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="data/db.js"></script>
    <script src="js/engine.js"></script>
    <script>
        let hospitalDatabase = [];
        let specialtyDatabase = [];

        function initPage() {
            hospitalDatabase = getModuleHospitalList('outpatient');
            specialtyDatabase = getModuleHospitalList('outpatientSpecialty');

            renderFilters();
            renderOutpatientGrid('outpatient-grid', hospitalDatabase);
            renderOutpatientGrid('outpatient-specialty-grid', specialtyDatabase, { type: 'specialty', hideInsurance: true });
            updateView();
        }

        function renderFilters() {
            const container = document.getElementById('filter-container');
            container.innerHTML = hospitalDatabase.map(h => `
                <label class="flex items-center gap-2.5 text-xs ${h.id === 'szufh' ? 'text-[#1D4E89] font-bold' : 'text-gray-600 font-medium'} cursor-pointer">
                    <input type="checkbox" value="${h.id}" checked class="w-4 h-4 rounded text-[#1D4E89]"> ${h.name}
                </label>
            `).join('');
        }

        function renderOutpatientGrid(gridId, hospitals, options = {}) {
            const grid = document.getElementById(gridId);
            if (!grid) return;
            grid.innerHTML = hospitals.map(h => renderOutpatientCardHtml(h, options)).join('');
        }

        window.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
