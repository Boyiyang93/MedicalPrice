<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="香港私家醫院內窺鏡與影像掃描定額比價">
    <title>內窺鏡與高階影像掃描臨床決策中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body data-page-module="imaging">
    <header class="h-16 bg-[#1D4E89] text-white fixed w-full z-[100] flex items-center px-6 shadow-md" role="banner">
        <button type="button" data-action="go-back-home" data-hash="#specialties" class="flex items-center gap-3" aria-label="返回首頁">
            <span class="w-7 h-7 bg-[#99D6D1] rounded-sm flex items-center justify-center text-[#1D4E89] font-bold">←</span>
            <span class="text-xl font-bold">MedicalPrice <span class="font-light opacity-60 ml-2">鏡檢與影像專線中心</span></span>
        </button>
    </header>
    <div class="flex">
        <aside class="sidebar-fixed p-6 hidden lg:block" aria-label="醫院篩選"><div id="filter-container" class="space-y-2.5"></div></aside>
        <main class="main-content flex-1 px-4 lg:px-10" role="main">
            <div class="max-w-6xl mx-auto">
                <h1 class="text-2xl font-black text-[#2B579A] mb-6">高頻內窺鏡與高階影像掃描臨床精算矩陣</h1>
                
                <section id="gastroscopy" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">日間胃鏡檢查臨床精算專區 (Gastroscopy)</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="imaging" data-procedure="gastroscopy"></div></div>
                </section>
                <section id="colonoscopy" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">日間結腸鏡檢查臨床精算專區 (Colonoscopy)</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="imaging" data-procedure="colonoscopy"></div></div>
                </section>
                <section id="dual_scope" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">黃金組合「胃鏡 + 大腸鏡」聯查專區</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="imaging" data-procedure="dual_scope"></div></div>
                </section>
                                <section id="bronchoscopy" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">支氣管鏡檢查</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="imaging" data-procedure="bronchoscopy"></div></div>
                </section>
                <section id="ct_brain" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">CT 腦部掃描臨床精算專區</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="imaging" data-procedure="ct_brain"></div></div>
                </section>
                <section id="mri_brain" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">MRI 腦部掃描臨床精算專區</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="imaging" data-procedure="mri_brain"></div></div>
                </section>
                                <footer class="mt-16 bg-gray-800 text-white rounded-xl overflow-hidden shadow-lg mb-8" role="contentinfo">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-px bg-gray-700">
                        <div class="bg-gray-800 p-8 flex flex-col">
                            <h4 class="text-lg font-bold mb-3">🏥 醫療機構專屬通道</h4>
                            <p class="text-sm text-gray-300 leading-relaxed mb-6 flex-grow">若貴院發現數據有誤，歡迎聯絡我們於 24 小時內優先處理更新請求。</p>
                            <a href="mailto:data@medicalprice.hk?subject=官方數據糾錯" class="inline-block bg-gray-700 hover:bg-gray-600 text-white text-sm font-bold py-2.5 px-5 rounded border border-gray-600 text-center md:w-auto">官方數據糾錯 →</a>
                        </div>
                        <div class="bg-gray-800 p-8 flex flex-col">
                            <h4 class="text-lg font-bold mb-3">💬 找不到想看的程序？</h4>
                            <p class="text-sm text-gray-300 leading-relaxed mb-6 flex-grow">數據庫持續擴充中，歡迎提交數據需求。</p>
                            <a href="mailto:contact@medicalprice.hk?subject=數據需求" class="inline-block bg-[#2B579A] hover:bg-[#1D4E89] text-white text-sm font-bold py-2.5 px-5 rounded text-center md:w-auto">聯繫我們 →</a>
                        </div>
                    </div>
                    <div class="bg-gray-900 p-6 text-xs text-gray-400">
                        <p class="leading-relaxed">⚖️ 免責聲明：所有數據僅供預算參考，<strong>不構成醫療診斷或理賠承諾</strong>。請於治療前向醫療機構確認最終報價。</p>
                    </div>
                </footer>
            </div>
        </main>
    </div>
    <script src="data/db.js"></script>
    <script src="js/engine.js"></script>
</body>
</html>
