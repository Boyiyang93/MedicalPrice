<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="香港私家醫院耳鼻喉科套餐價格比較">
    <title>耳鼻喉科收費比較 | MedicalPrice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body data-page-module="ent">
    <header class="h-16 bg-[#1D4E89] text-white fixed w-full z-[100] flex items-center px-6 shadow-md" role="banner">
        <div class="flex items-center gap-3">
            <button type="button" data-action="go-back-home" data-hash="#specialties" class="w-7 h-7 bg-[#99D6D1] rounded-sm flex items-center justify-center text-[#1D4E89] font-bold hover:bg-white transition-colors" aria-label="返回首頁">←</button>
            <span class="text-xl font-bold tracking-tighter">MedicalPrice <span class="font-light opacity-60 ml-2">耳鼻喉科收費比較</span></span>
        </div>
    </header>
    <div class="flex">
        <aside class="sidebar-fixed p-6 hidden lg:block" aria-label="醫院篩選">
            <div class="mb-6"><p class="text-xs font-bold text-gray-400 mb-2">📍 當前專科</p>
            <div class="text-xs font-bold text-[#1D4E89] p-2.5 bg-blue-50 rounded">👂 耳鼻喉科套餐價格比較</div></div>
            <div id="filter-container" class="space-y-3 px-1 h-[450px] overflow-y-auto"></div>
        </aside>
        <main class="main-content flex-1 px-4 lg:px-10" role="main">
            <div class="max-w-6xl mx-auto">
                <section class="mb-8">
                    <h1 class="text-2xl font-black text-[#2B579A] mb-4">全港私家醫院耳鼻喉科套餐價格比較</h1>
                    <div class="mt-6 bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-wrap gap-6 hidden surgery-filter-panel" data-surgery-filter-panel>
                        <div class="flex-1 min-w-[240px]">
                            <label for="insurance-select" class="block text-xs font-bold text-gray-500 mb-2">🛡️ 醫療保障</label>
                            <select id="insurance-select" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm bg-gray-50">
                                <option value="none">沒有醫療保險（全額自付）</option>
                                <option value="vhis-std">VHIS 標準計劃</option>
                                <option value="vhis-adv">VHIS 靈活／高端計劃</option>
                            </select>
                        </div>
                    </div>
                </section>
                                <p class="text-xs text-gray-500 mb-6 bg-blue-50/50 inline-block px-3 py-1 rounded hidden surgery-filter-hint">ℹ️ 已收錄套餐價格的醫院會優先顯示；暫未收錄的項目將陸續補充。</p>
                <section id="tonsillectomy" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">扁桃體切除術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="ent" data-procedure="tonsillectomy"></div></div>
                </section>
                <section id="micro_laryngoscopy" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">微型喉鏡檢查</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="ent" data-procedure="micro_laryngoscopy"></div></div>
                </section>
                <section id="adenoid_tonsil" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">腺樣體及扁桃體手術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="ent" data-procedure="adenoid_tonsil"></div></div>
                </section>
                <section id="sinus_surgery" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">鼻竇炎及鼻中隔手術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="ent" data-procedure="sinus_surgery"></div></div>
                </section>
                <section id="tympanoplasty" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">鼓膜修補及顯微喉鏡</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="ent" data-procedure="tympanoplasty"></div></div>
                </section>
                                <footer class="mt-16 bg-gray-800 text-white rounded-xl overflow-hidden shadow-lg mb-8" role="contentinfo">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-px bg-gray-700">
                        <div class="bg-gray-800 p-8 flex flex-col">
                            <h4 class="text-lg font-bold mb-3">🏥 醫療機構專屬通道</h4>
                            <p class="text-sm text-gray-300 leading-relaxed mb-6 flex-grow">若貴院發現資料有誤，歡迎聯絡我們於 24 小時內優先處理更新請求。</p>
                            <a href="mailto:data@medicalprice.hk?subject=官方資料糾錯" class="inline-block bg-gray-700 hover:bg-gray-600 text-white text-sm font-bold py-2.5 px-5 rounded border border-gray-600 text-center md:w-auto">官方資料糾錯 →</a>
                        </div>
                        <div class="bg-gray-800 p-8 flex flex-col">
                            <h4 class="text-lg font-bold mb-3">💬 找不到想看的程序？</h4>
                            <p class="text-sm text-gray-300 leading-relaxed mb-6 flex-grow">資料庫持續擴充中，歡迎提交資料需求。</p>
                            <a href="mailto:contact@medicalprice.hk?subject=資料需求" class="inline-block bg-[#2B579A] hover:bg-[#1D4E89] text-white text-sm font-bold py-2.5 px-5 rounded text-center md:w-auto">聯絡我們 →</a>
                        </div>
                    </div>
                    <div class="bg-gray-900 p-6 text-xs text-gray-400">
                        <p class="leading-relaxed">⚖️ 免責聲明：所有資料僅供預算參考，<strong>不構成醫療診斷或理賠承諾</strong>。請於治療前向醫療機構確認最終報價。</p>
                    </div>
                </footer>
            </div>
        </main>
    </div>
    <script src="data/db.js"></script>
    <script src="js/engine.js"></script>
</body>
</html>
