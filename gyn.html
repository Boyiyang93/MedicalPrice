<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="香港私家醫院婦產科分娩套餐定額比價">
    <title>醫療價格第三方門戶 - 婦產科決策中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/design-system.css">
</head>
<body data-page-module="gynecology">
    <header class="h-16 bg-[#1D4E89] text-white fixed w-full z-[100] flex items-center px-6 justify-between shadow-md" role="banner">
        <div class="flex items-center gap-3 min-w-0">
            <button type="button" data-action="go-back-home" data-hash="#specialties" class="w-7 h-7 shrink-0 bg-[#99D6D1] rounded-sm flex items-center justify-center text-[#1D4E89] font-bold hover:bg-white transition-colors" aria-label="返回首頁">←</button>
            <span class="text-xl font-bold tracking-tighter truncate">MedicalPrice <span class="font-light opacity-60 ml-2">婦產科決策中心</span></span>
        </div>
    </header>
    <div class="flex">
        <aside class="sidebar-fixed p-6 hidden lg:block"><div id="filter-container" class="space-y-3"></div></aside>
        <main class="main-content flex-1 px-4 lg:px-10" role="main">
            <div class="max-w-6xl mx-auto">
                <h1 class="text-2xl font-black text-[#2B579A] mb-6">全港私家醫院婦產科分娩套餐定額對比</h1>
                                <section id="normal_delivery" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">自然分娩套餐</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="gynecology" data-procedure="normal_delivery"></div></div>
                </section>
                <section id="c_section" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">剖腹產套餐</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="gynecology" data-procedure="c_section"></div></div>
                </section>
                <section id="cervical_treatment" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">子宮頸病變治療手術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="gynecology" data-procedure="cervical_treatment"></div></div>
                </section>
                <section id="hysteroscopy" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">子宮鏡診治手術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="gynecology" data-procedure="hysteroscopy"></div></div>
                </section>
                <section id="myomectomy" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">子宮肌瘤切除術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="gynecology" data-procedure="myomectomy"></div></div>
                </section>
                <section id="hysterectomy" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">子宮切除術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="gynecology" data-procedure="hysterectomy"></div></div>
                </section>
                <section id="tubal_ectopic" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">輸卵管及宮外孕手術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="gynecology" data-procedure="tubal_ectopic"></div></div>
                </section>
                <section id="ovarian_cyst" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">卵巢囊腫切除術</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="gynecology" data-procedure="ovarian_cyst"></div></div>
                </section>
                <section id="contraception" class="mb-8">
                    <h2 class="lane-header text-base font-bold text-[#2B579A] mb-2">避孕及終止妊娠</h2>
                    <div class="lane-container"><div class="compare-group grid grid-cols-1 md:grid-cols-3 gap-4" data-module="gynecology" data-procedure="contraception"></div></div>
                </section>
                                <footer class="mt-16 bg-gray-800 text-white rounded-xl overflow-hidden shadow-lg mb-8" role="contentinfo">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-px bg-gray-700">
                        <div class="bg-gray-800 p-8 flex flex-col">
                            <h4 class="text-lg font-bold mb-3">🏥 醫療機構專屬通道</h4>
                            <p class="text-sm text-gray-300 leading-relaxed mb-6 flex-grow">若貴院發現數據有誤，歡迎聯絡我們於 24 小時內優先處理更新請求。</p>
                            <a href="mailto:data@medicalprice.hk?subject=官方數據糾錯" class="inline-block bg-gray-700 hover:bg-gray-600 text-white text-sm font-bold py-2.5 px-5 rounded border border-gray-600 text-center md:w-auto">官方數據糾錯 →</a>
                        </div>
                        <div class="bg-gray-800 p-8 flex flex-col">
                            <h4 class="text-lg font-bold mb-3">💬 找不到想看的程序？</h4>
                            <p class="text-sm text-gray-300 leading-relaxed mb-6 flex-grow">數據庫持續擴充中，歡迎提交數據需求。</p>
                            <a href="mailto:contact@medicalprice.hk?subject=數據需求" class="inline-block bg-[#2B579A] hover:bg-[#1D4E89] text-white text-sm font-bold py-2.5 px-5 rounded text-center md:w-auto">聯繫我們 →</a>
                        </div>
                    </div>
                    <div class="bg-gray-900 p-6 text-xs text-gray-400">
                        <p class="leading-relaxed">⚖️ 免責聲明：所有數據僅供預算參考，<strong>不構成醫療診斷或理賠承諾</strong>。請於治療前向醫療機構確認最終報價。</p>
                    </div>
                </footer>
            </div>
        </main>
    </div>
    <script src="data/db.js"></script>
    <script src="js/engine.js"></script>
</body>
</html>
