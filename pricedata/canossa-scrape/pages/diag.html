<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>1.1 [2] Canossa Hospital</title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta http-equiv="imagetoolbar" content="no" />
		<link rel="stylesheet" type="text/css" href="css/layout.css" />
	<link rel="stylesheet" type="text/css" href="css/common.css" />
			<script type="text/javascript" src="js/jquery.js"></script>
		<script type="text/javascript" src="js/init.js"></script>
	<script type="text/javascript">
		$(document).ready(function() {
			var all_images = ["1.1.png","1.2.png","1.3.png","1.4.png","1.5.png"];
			var all_layout = [2,1];
			var version = 2;
			var max = 10;
			var keydown = [];
			var ratio = 1;
			var angle = 0;
			var timeout = [];
			$(this).keydown(function(e) {
				keydown.push(e.which);
				if(keydown.length > max)
				{
					keydown.shift();
				}
				if(keyMatch([ 49 ], e) || keyMatch([ 97 ], e) || keyMatch([ 65, 76, 76 ], e))
				{
					viewall();
				}
				else if(keyMatch([ 33 ], e))
				{
					var next = $.inArray(version, all_layout);
					if(next > 0)
					{
						location.href = '../' + all_layout[(next - 1)];
					}
				}
				else if(keyMatch([ 34 ], e))
				{
					var prev = $.inArray(version, all_layout);
					if((prev + 1) < all_layout.length)
					{
						location.href = '../' + all_layout[(prev + 1)];
					}
				}
				else if(keyMatch([ 36 ], e))
				{
					var first = all_images[0].replace(/\..{1,4}$/, '');
					if(first != $('body').attr('data-file'))
					{
						location.href = first;
					}
				}
				else if(keyMatch([ 35 ], e))
				{
					var last = all_images[(all_images.length - 1)].replace(/\..{1,4}$/, '');
					if(last != $('body').attr('data-file'))
					{
						location.href = last;
					}
				}
							});
			
			function keyMatch(pattern, e) {
				var match = false;
				if(keydown.length >= pattern.length)
				{
					$.each(keydown, function(index, value) {
						if(value == pattern[0])
						{
							pattern.shift();
							if(! pattern.length)
							{
								keydown = [];
								match = true;
								e.preventDefault();
								return false;
							}
						}
					});
				}
				return match;
			}
			
			function viewall() {
				if($('#slider').length)
				{
					$('#slider').Slider('destory');
				}
				$('body').children().remove();
				$('body').append('<div id="view-all" />');	
				var extra = '';			
				var current = $('body').attr('data-file');
				$.each(timeout, function(index, value) {
					clearTimeout(value);
				});
				timeout = [];
				$.each(all_images, function(index, value) {
					timeout.push(setTimeout(function() {
						var name = value.replace(/\..{1,4}$/, '');
						$('#view-all').append('<a class="view-all-wrapper' + (current == name ? ' selected' : '') + '" href="' + extra + name + '" style="background-image: url(' + value + ');">' +
											  '		<span class="overlay">' +
											  '			<span class="bg" />' +
											  '			<h2>' + name + '</h2>' +
											  '			<span class="h-fix" />' +
											  '		</span">' +
											  '</a>').children(':last').hide().fadeIn();
					}, index * 100));					
				});
			}
			
						
		});
	</script>
		</head>
<body data-prev="1.5" data-next="1.2" data-file="1.1" style="background-color: #191919;">
	<div class="container">
		<div id="preview-image">
			<img src="1.1.png" alt="" style="margin-left: -952px;" />
		</div>
					</div>
		<div class="preload-images">
		<img src="1.5.png" alt="" />
		<img src="1.2.png" alt="" />
	</div>
		<a href="1.2" class="next-page"></a>
	</body>
</html>
